name: CI | Test Worker

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test share one job: the image name contains the Docker Hub
  # namespace, which matches a secret, and GitHub drops job outputs that
  # contain secret values.
  build-and-test:
    # Fork PRs get no secrets, so they can neither push the image nor
    # create an endpoint.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q builder

      - name: Pick the CI image tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_REPO: ${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}
        run: |
          # One tag per PR or branch, overwritten on every push, so CI
          # images don't pile up in Docker Hub.
          if [ -n "$PR_NUMBER" ]; then suffix="pr-$PR_NUMBER"; else suffix="$REF_NAME"; fi
          suffix="$(echo "$suffix" | tr -c 'A-Za-z0-9_.\n-' '-')"
          # Docker tags max out at 128 chars; keep "ci-" + suffix well under it,
          # with a hash of the full name so truncated names don't collide.
          if [ "${#suffix}" -gt 100 ]; then
            hash="$(printf '%s' "$suffix" | sha256sum | cut -c1-8)"
            suffix="${suffix:0:90}-$hash"
          fi
          echo "image=$IMAGE_REPO:ci-$suffix" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the CI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image }}
          # The test only uses turbo; the release image bakes every model.
          build-args: |
            WHISPER_MODELS=turbo

      # Pinned to the head of runpod-workers/worker-github_runner#13, which
      # stays resolvable after that PR merges and its branch is deleted.
      # Move to @main after it merges.
      - name: Run .runpod/tests.json on a temporary endpoint
        uses: runpod-workers/worker-github_runner/test-image@757ffa21a01a55d9fa9bbf8d1adc4f4b2135c3e9
        with:
          # The digest pins the exact image built in this run; the tag is shared and mutable.
          image: ${{ steps.tag.outputs.image }}@${{ steps.build.outputs.digest }}
          runpod-api-key: ${{ secrets.RUNPOD_API_KEY }}
          handler: /rp_handler.py
